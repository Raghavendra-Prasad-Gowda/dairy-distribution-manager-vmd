name: 🐛 Bug report
description: Something in VMD is not working as expected
labels: [bug]
body:
  - type: dropdown
    id: area
    attributes:
      label: Where did it happen?
      options:
        - Stock receipt
        - Dairy payments / ledger
        - Dispatch
        - Salesperson collections / ledger
        - Bills
        - Reports
        - Setup screens
        - Login / MFA
        - Other
    validations:
      required: true
  - type: dropdown
    id: role
    attributes:
      label: Signed in as
      options: [Superadmin, Admin, Dispatcher, Salesman]
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: "1. Open ...\n2. Tap ...\n3. See ..."
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected vs actual result
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Build version
      description: Shown in the sidebar footer / login page (e.g. v1.0.4 · abc1234)
  - type: textarea
    id: extra
    attributes:
      label: Screenshots / extra context
      description: Do not paste passwords, PINs or customer data.
