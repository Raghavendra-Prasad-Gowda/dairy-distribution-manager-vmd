version: 2
updates:
  # Server dependencies
  - package-ecosystem: "npm"
    directory: "/server"
    schedule:
      interval: "weekly"
    target-branch: "environment/test"
    open-pull-requests-limit: 10
    groups:
      # Bundle low-risk patch/minor bumps into one PR per week instead of
      # opening a dozen individually — major bumps still get their own PR.
      minor-and-patch:
        update-types: ["minor", "patch"]

  # Client dependencies
  - package-ecosystem: "npm"
    directory: "/client"
    schedule:
      interval: "weekly"
    target-branch: "environment/test"
    open-pull-requests-limit: 10
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]

  # GitHub Actions used in workflows
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    target-branch: "environment/test"
