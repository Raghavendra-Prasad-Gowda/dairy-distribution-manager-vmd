name: auto-merge-develop

# Merges a pull request into develop as soon as every job of pr-checks has passed.
#
# GitHub's own auto-merge needs branch protection, which this private repo's plan does not offer,
# so this workflow does the same job: it runs when pr-checks finishes and merges with a merge commit.
#
# It never touches main (the develop -> main release PR stays a manual merge), forks, draft PRs, or
# PRs labelled `no-auto-merge`. Note: workflow_run workflows run from the default branch (develop),
# so this only takes effect once it has been merged into develop.

on:
  workflow_run:
    workflows: [pr-checks]
    types: [completed]

permissions:
  contents: write
  pull-requests: write
  actions: write

# One merge attempt per PR at a time.
concurrency:
  group: auto-merge-${{ github.event.workflow_run.pull_requests[0].number || github.run_id }}
  cancel-in-progress: false

jobs:
  merge:
    name: merge-when-checks-pass
    # Only a successful pr-checks run on a pull request from this repository (not a fork).
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    env:
      RELEASE_BOT_APP_ID: ${{ secrets.RELEASE_BOT_APP_ID }}
    steps:
      # Merges made with the default GITHUB_TOKEN do not start other workflows, so staging-pipeline
      # would not run on develop. A GitHub App token does (needs Contents + Pull requests: read & write).
      - name: Create GitHub App token
        id: app-token
        if: ${{ env.RELEASE_BOT_APP_ID != '' }}
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.RELEASE_BOT_APP_ID }}
          private-key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}

      - name: Merge the pull request
        id: merge
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
          CHECKED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          if [ -z "${PR_NUMBER:-}" ]; then
            echo "No pull request is attached to this pr-checks run - nothing to merge."
            exit 0
          fi

          pr=$(gh pr view "$PR_NUMBER" --repo "$REPO" --json state,isDraft,baseRefName,headRefOid,labels)
          state=$(jq -r .state <<<"$pr")
          draft=$(jq -r .isDraft <<<"$pr")
          base=$(jq -r .baseRefName <<<"$pr")
          head=$(jq -r .headRefOid <<<"$pr")
          optout=$(jq -r '[.labels[].name] | index("no-auto-merge") != null' <<<"$pr")

          skip() { echo "Skipping PR #$PR_NUMBER: $1"; echo "### Auto-merge skipped for #$PR_NUMBER" >> "$GITHUB_STEP_SUMMARY"; echo "$1" >> "$GITHUB_STEP_SUMMARY"; exit 0; }

          [ "$state" = "OPEN" ]      || skip "the pull request is $state."
          [ "$base" = "develop" ]    || skip "it targets $base, not develop (only develop is auto-merged)."
          [ "$draft" = "false" ]     || skip "it is a draft."
          [ "$optout" = "false" ]    || skip "it has the no-auto-merge label."
          [ "$head" = "$CHECKED_SHA" ] || skip "new commits were pushed after these checks ran; the next pr-checks run will decide."

          # --match-head-commit makes GitHub refuse the merge if the branch moved since the checks.
          gh pr merge "$PR_NUMBER" --repo "$REPO" --merge --match-head-commit "$CHECKED_SHA"
          echo "merged=true" >> "$GITHUB_OUTPUT"
          {
            echo "### Auto-merged #$PR_NUMBER into develop"
            echo "All pr-checks jobs passed on \`${CHECKED_SHA:0:7}\`."
          } >> "$GITHUB_STEP_SUMMARY"

      # Only needed without the GitHub App token: the merge above (made by GITHUB_TOKEN) did not
      # trigger staging-pipeline, but workflow_dispatch is allowed to.
      - name: Start staging-pipeline
        if: ${{ steps.merge.outputs.merged == 'true' && env.RELEASE_BOT_APP_ID == '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run staging-pipeline.yml --repo "${{ github.repository }}" --ref develop
