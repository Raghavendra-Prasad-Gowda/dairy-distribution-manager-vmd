name: PR Checks

on:
  pull_request:
    branches: [main]

jobs:
  lint-timezone:
    name: Lint — timezone safety
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: node scripts/check-timezone-safety.js

  lint-server:
    name: Lint (server)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npm run lint

  lint-client:
    name: Lint (client)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - run: npm run lint

  api-tests:
    name: API Tests + coverage gate (server)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      # test:coverage runs the full suite under c8 and fails the job if coverage
      # drops below the thresholds in .c8rc.json (90/75/85/90 stmts/branches/funcs/lines).
      - run: npm run test:coverage
        env:
          NODE_ENV: test
          JWT_SECRET: test-secret-for-ci
          EDIT_PIN: '123456'

  ui-tests:
    name: UI Tests + coverage gate (client)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      # test:coverage runs the full suite under Vitest's v8 coverage and fails
      # the job if coverage drops below the thresholds in vite.config.js
      # (78/68/70/80 stmts/branches/funcs/lines).
      - run: npm run test:coverage

  ui-build:
    name: Build (client)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - run: npm run build

  lint-api-spec:
    name: Lint OpenAPI spec
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npx --yes @redocly/cli lint docs/openapi.yaml

  security-audit:
    name: Dependency vulnerability scan
    runs-on: ubuntu-latest
    strategy:
      matrix:
        package: [server, client]
    defaults:
      run:
        working-directory: ${{ matrix.package }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ${{ matrix.package }}/package-lock.json
      - run: npm ci
      # Fails the PR on any moderate-or-worse known vulnerability, EXCEPT the
      # advisories explicitly accepted in server/scripts/check-vulnerabilities.js
      # (currently: mysql2, bundled by the prisma CLI for its multi-database
      # driver support and never loaded for this app's postgresql-only
      # datasource — see that script for the full reasoning per entry). client
      # has no accepted exceptions, so it runs the plain audit unchanged; this
      # is a regression gate, not a backlog — Dependabot keeps deps current so
      # both stay green, and a new or escalated advisory on the same package
      # still fails, since the allowlist matches severity, not just name.
      - if: matrix.package == 'server'
        run: node scripts/check-vulnerabilities.js
      - if: matrix.package == 'client'
        run: npm audit --audit-level=moderate
