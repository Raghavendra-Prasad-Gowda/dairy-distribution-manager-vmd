name: pr-checks

on:
  pull_request:
    branches: [main, develop]

jobs:
  lint-timezone:
    name: lint-timezone-safety
    # Release PRs (develop → main) skip: develop already passed these checks and
    # Staging Verified. Skipped jobs count as passing for required checks.
    if: github.base_ref != 'main' || github.head_ref != 'release/next'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: node scripts/check-timezone-safety.js

  lint-server:
    name: lint-server
    # Release PRs (develop → main) skip: develop already passed these checks and
    # Staging Verified. Skipped jobs count as passing for required checks.
    if: github.base_ref != 'main' || github.head_ref != 'release/next'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npm run lint

  lint-client:
    name: lint-client
    # Release PRs (develop → main) skip: develop already passed these checks and
    # Staging Verified. Skipped jobs count as passing for required checks.
    if: github.base_ref != 'main' || github.head_ref != 'release/next'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - run: npm run lint

  api-tests:
    name: api-tests-coverage-server
    # Release PRs (develop → main) skip: develop already passed these checks and
    # Staging Verified. Skipped jobs count as passing for required checks.
    if: github.base_ref != 'main' || github.head_ref != 'release/next'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      # test:coverage runs the full suite under c8 and fails the job if coverage
      # drops below the thresholds in .c8rc.json (70/80/85/70 stmts/branches/funcs/lines).
      - run: npm run test:coverage
        env:
          NODE_ENV: test
          JWT_SECRET: test-secret-for-ci
          EDIT_PIN: '123456'

  ui-tests:
    name: ui-tests-coverage-client
    # Release PRs (develop → main) skip: develop already passed these checks and
    # Staging Verified. Skipped jobs count as passing for required checks.
    if: github.base_ref != 'main' || github.head_ref != 'release/next'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      # test:coverage runs the full suite under Vitest's v8 coverage and fails
      # the job if coverage drops below the thresholds in vite.config.js
      # (78/68/70/80 stmts/branches/funcs/lines).
      - run: npm run test:coverage

  ui-build:
    name: build-client
    # Release PRs (develop → main) skip: develop already passed these checks and
    # Staging Verified. Skipped jobs count as passing for required checks.
    if: github.base_ref != 'main' || github.head_ref != 'release/next'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - run: npm run build

  lint-api-spec:
    name: lint-openapi-spec
    # Release PRs (develop → main) skip: develop already passed these checks and
    # Staging Verified. Skipped jobs count as passing for required checks.
    if: github.base_ref != 'main' || github.head_ref != 'release/next'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npx --yes @redocly/cli lint docs/openapi.yaml

  security-audit:
    name: dependency-vulnerability-scan-${{ matrix.package }}
    # Release PRs (develop → main) skip: develop already passed these checks and
    # Staging Verified. Skipped jobs count as passing for required checks.
    if: github.base_ref != 'main' || github.head_ref != 'release/next'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        package: [server, client]
    defaults:
      run:
        working-directory: ${{ matrix.package }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ${{ matrix.package }}/package-lock.json
      - run: npm ci
      # Fails the PR on any moderate-or-worse known vulnerability. Both
      # packages are clean as of this writing — this is a regression gate,
      # not a backlog. Dependabot (.github/dependabot.yml) keeps deps current
      # so this stays green.
      - run: npm audit --audit-level=moderate

  automation-compile:
    name: compile-automation-suite
    # Release PRs (develop → main) skip: develop already passed these checks and
    # Staging Verified. Skipped jobs count as passing for required checks.
    if: github.base_ref != 'main' || github.head_ref != 'release/next'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server/automation
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: maven
          cache-dependency-path: server/automation/pom.xml
      # Catches a broken step definition or page object before it reaches the staging pipeline.
      # The suite itself needs a deployed environment, so it only runs in staging-pipeline.yml.
      - run: mvn -B -ntp test-compile
      # UI suite (Playwright + TypeScript): typecheck only; it runs against a deployed env in staging.
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/automation-ui/package-lock.json
      - run: npm ci
        working-directory: client/automation-ui
      - run: npm run typecheck
        working-directory: client/automation-ui
