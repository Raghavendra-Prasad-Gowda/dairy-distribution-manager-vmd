name: staging-pipeline

# Runs after every merge to develop. Render and Vercel auto-deploy the testing apps on their own;
# this pipeline waits for that deploy to finish, runs API then UI automation against it and,
# when everything passes, marks the commit "Staging Verified" and opens/updates the
# develop -> main release PR for a human to approve.

on:
  push:
    branches: [develop]
  workflow_dispatch:

# A newer merge supersedes an older run - only the latest develop commit matters.
concurrency:
  group: staging-pipeline
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Override with repository variables if the testing URLs ever change.
  API_URL: ${{ vars.STAGING_API_URL || 'https://dairy-distribution-manager-vmd-testing.onrender.com' }}
  WEB_URL: ${{ vars.STAGING_WEB_URL || 'https://dairy-distribution-manager-vmd-testing.vercel.app' }}
  VERCEL_PROJECT: ${{ vars.STAGING_VERCEL_PROJECT || 'dairy-distribution-manager-vmd-testing' }}
  # Pipeline dashboard on GitHub Pages (pipeline-dashboard.yml); linked from the Slack cards and the release PR.
  DASHBOARD_URL: ${{ vars.DASHBOARD_URL || format('https://{0}.github.io/{1}/', github.repository_owner, github.event.repository.name) }}

jobs:
  wait-for-deploy:
    name: wait-for-testing-deploy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      # Commit the backend is really running (== pushed SHA unless Render skipped the deploy).
      backend_commit: ${{ steps.render.outputs.commit }}
    permissions:
      contents: read
      deployments: read
      statuses: write
    steps:
      - uses: actions/checkout@v7

      # Blocks the release PR immediately: the previous "Staging Verified" belongs to an older SHA.
      - name: Mark Staging Verified as pending
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X POST "repos/${{ github.repository }}/statuses/${{ github.sha }}" \
            -f state=pending -f context="Staging Verified" \
            -f description="Waiting for deploy and automation" \
            -f target_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      - name: Wait for Render (backend)
        id: render
        env:
          GH_TOKEN: ${{ github.token }}
        run: .github/scripts/wait-for-backend.sh "$API_URL" "${{ github.sha }}"

      - name: Wait for Vercel (frontend)
        env:
          GH_TOKEN: ${{ github.token }}
          VERCEL_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: .github/scripts/wait-for-vercel.sh "${{ github.repository }}" "${{ github.sha }}" "$VERCEL_PROJECT" "$WEB_URL"

  api-e2e:
    name: api-automation
    needs: wait-for-deploy
    runs-on: ubuntu-latest
    # With the superadmin secrets set, every scenario runs instead of ~125 skipping. Against the
    # free-tier testing backend (each dispatch/receipt write takes ~3 s) that is well over 20 min.
    timeout-minutes: 75
    # E2E_ADMIN_* live in the "staging" environment's secrets; without this the job sees them empty.
    environment: staging
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: maven
          cache-dependency-path: server/automation/pom.xml
      - name: Run @api scenarios
        working-directory: server/automation
        env:
          API_BASE_URL: ${{ env.API_URL }}
          # The build /health must report: the commit Render runs, which is not the pushed SHA
          # when the push changed nothing under server/ and Render skipped the deploy.
          EXPECTED_COMMIT: ${{ needs.wait-for-deploy.outputs.backend_commit || github.sha }}
          # Authenticated @api scenarios log in once per role per run (login is limited to 20/hour/IP).
          E2E_ADMIN_USERNAME: ${{ secrets.E2E_ADMIN_USERNAME }}
          E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}
          # Optional second account (superadmin, no MFA). Scenarios that need one - creating brands, admin
          # users, dispatchers, resetting ledgers - are skipped without it. See server/automation/README.md.
          E2E_SUPERADMIN_USERNAME: ${{ secrets.E2E_SUPERADMIN_USERNAME }}
          E2E_SUPERADMIN_PASSWORD: ${{ secrets.E2E_SUPERADMIN_PASSWORD }}
          # Set the repository variable E2E_STRICT=true once the superadmin secrets exist: a missing
          # prerequisite then fails the run instead of silently skipping those scenarios.
          E2E_STRICT: ${{ vars.E2E_STRICT }}
        # @known-defect scenarios document API bugs that are not fixed yet; @shared-state scenarios change state
        # real users share (finalising the day). Neither belongs in the release gate.
        run: mvn -B -ntp test -Dcucumber.filter.tags="@api and not @known-defect and not @shared-state"
      - name: Summarise scenarios
        if: always()
        working-directory: server/automation
        run: |
          python3 - >> "$GITHUB_STEP_SUMMARY" <<'PY'
          import json, os
          path = "target/cucumber-reports/report.json"
          # Cucumber writes the JSON report only when the run ends, so a cancelled or timed-out run
          # leaves it missing or empty.
          if not os.path.exists(path) or os.path.getsize(path) == 0:
              print("### API automation\nNo report was produced - the run was cancelled or timed out before it finished."); raise SystemExit
          total = failed = skipped = 0
          for feature in json.load(open(path)):
              background_bad = False
              for el in feature["elements"]:
                  steps = el["steps"]
                  statuses = [s["result"]["status"] for s in steps]
                  if el["type"] == "background":
                      background_bad = any(x not in ("passed",) for x in statuses)
                      continue
                  total += 1
                  if any(x in ("failed", "undefined", "pending", "ambiguous") for x in statuses) or background_bad:
                      failed += 1
                  elif statuses and all(x == "skipped" for x in statuses):
                      skipped += 1
          print("### API automation")
          print(f"{total} scenarios: **{total - failed - skipped} passed**, {failed} failed, {skipped} skipped")
          if skipped:
              print("\nSkipped scenarios are missing a prerequisite (usually the E2E superadmin secrets) - see server/automation/README.md.")
          PY
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: api-e2e-report
          path: server/automation/target/cucumber-reports
          if-no-files-found: ignore

  ui-e2e:
    name: ui-automation
    needs: api-e2e
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: staging
    defaults:
      run:
        working-directory: client/automation-ui
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/automation-ui/package-lock.json
      - run: npm ci
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Run UI tests
        env:
          CI: "true"
          WEB_BASE_URL: ${{ env.WEB_URL }}
          VERCEL_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          E2E_ADMIN_USERNAME: ${{ secrets.E2E_ADMIN_USERNAME }}
          E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}
          # Specs arrange their data (throwaway brand, product, salesperson, ...) through the API and clean it up
          # the same way; the browser only acts and asserts. Specs that need it skip when it is missing.
          API_BASE_URL: ${{ env.API_URL }}
          # Superadmin (no MFA): throwaway brands, dispatcher logins, the Admin Users journey.
          E2E_SUPERADMIN_USERNAME: ${{ secrets.E2E_SUPERADMIN_USERNAME }}
          E2E_SUPERADMIN_PASSWORD: ${{ secrets.E2E_SUPERADMIN_PASSWORD }}
          # Edit PIN (deleting a payment) and Profit & Loss PIN: the specs that type them skip without them.
          E2E_EDIT_PIN: ${{ secrets.E2E_EDIT_PIN }}
          E2E_PL_PIN: ${{ secrets.E2E_PL_PIN }}
          E2E_STRICT: ${{ vars.E2E_STRICT }}
        run: npm test
      - name: Summarise tests
        if: always()
        env:
          REPORT: test-results/results.json
        run: python3 ../../.github/scripts/ui-job-summary.py >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ui-e2e-report
          path: |
            client/automation-ui/playwright-report
            client/automation-ui/test-results
          if-no-files-found: ignore

  finalize:
    name: report-staging-verified
    needs: [wait-for-deploy, api-e2e, ui-e2e]
    # Runs on failure too (so the status turns red), but not when this run was superseded.
    if: ${{ always() && !cancelled() }}
    runs-on: ubuntu-latest
    # Same environment as the test jobs, so SLACK_WEBHOOK_URL works whether it is stored as a
    # repository secret or as a secret of the "staging" environment.
    environment: staging
    permissions:
      contents: read
      statuses: write
    env:
      # Job-level so the Slack steps' `if` can see it (a step's own env is not visible to its `if`).
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
    steps:
      - name: Post Staging Verified status
        env:
          GH_TOKEN: ${{ github.token }}
          UI_RESULT: ${{ needs.ui-e2e.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ "$UI_RESULT" = "success" ]; then
            state=success; desc="Deployed, API and UI automation passed"
          else
            state=failure; desc="Deploy or automation failed - see run"
          fi
          gh api -X POST "repos/${{ github.repository }}/statuses/${{ github.sha }}" \
            -f state="$state" -f context="Staging Verified" \
            -f description="$desc" -f target_url="$RUN_URL"
      - uses: actions/checkout@v7
        if: ${{ env.SLACK_WEBHOOK_URL != '' }}
      # Missing when a job was cancelled or never ran; the card then says so.
      - uses: actions/download-artifact@v4
        if: ${{ env.SLACK_WEBHOOK_URL != '' }}
        continue-on-error: true
        with:
          name: api-e2e-report
          path: reports/api
      - uses: actions/download-artifact@v4
        if: ${{ env.SLACK_WEBHOOK_URL != '' }}
        continue-on-error: true
        with:
          name: ui-e2e-report
          path: reports/ui
      # One card per suite, so the API and UI results (and their failures) each get their own message.
      - name: Post API results to Slack
        if: ${{ env.SLACK_WEBHOOK_URL != '' }}
        env:
          SUITE: api
          REPORT: reports/api/report.json
          RESULT: ${{ needs.api-e2e.result }}
          TARGET_URL: ${{ env.API_URL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          ACTOR: ${{ github.actor }}
          COMMIT_SUBJECT: ${{ github.event.head_commit.message }}
        run: .github/scripts/post-slack-card.sh
      - name: Post UI results to Slack
        if: ${{ env.SLACK_WEBHOOK_URL != '' }}
        env:
          SUITE: ui
          REPORT: reports/ui/test-results/results.json
          RESULT: ${{ needs.ui-e2e.result }}
          TARGET_URL: ${{ env.WEB_URL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          ACTOR: ${{ github.actor }}
          COMMIT_SUBJECT: ${{ github.event.head_commit.message }}
        run: .github/scripts/post-slack-card.sh

  release-pr:
    name: open-release-pr
    needs: [ui-e2e, finalize]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      statuses: write
    env:
      # Job-level: the `secrets` context is not allowed in a step `if`, `env` is.
      RELEASE_BOT_APP_ID: ${{ secrets.RELEASE_BOT_APP_ID }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # A PR opened with the default GITHUB_TOKEN does not trigger other workflows, so pr-checks
      # would never run on it. A GitHub App token does. Falls back to GITHUB_TOKEN if no app is set up.
      - name: Create GitHub App token
        id: app-token
        if: ${{ env.RELEASE_BOT_APP_ID != '' }}
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.RELEASE_BOT_APP_ID }}
          private-key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}

      # The release PR head is `release/next` = develop + main + a version bump. The bump lands in
      # package.json BEFORE Render/Vercel build production, so the footer/health show the release
      # number that production-verify then tags (Vercel's clone has no tags to read).
      - name: Prepare release branch with version bump
        id: prep
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || github.token }}
        run: |
          git fetch --tags --force origin
          ahead=$(git rev-list --count origin/main..origin/develop)
          if [ "$ahead" -eq 0 ]; then
            echo "develop has nothing that main lacks - no release PR needed"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          next=$(.github/scripts/next-version.sh)
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B release/next "$GITHUB_SHA"
          git merge --no-edit origin/main
          for dir in server client; do
            (cd "$dir" && npm version "$next" --no-git-tag-version --allow-same-version >/dev/null)
          done
          git add server/package.json server/package-lock.json client/package.json client/package-lock.json
          git commit -m "chore(release): v$next" || echo "version already $next"
          git push --force "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" release/next
          sha=$(git rev-parse HEAD)
          # The bump touches only package*.json; staging already verified the code of $GITHUB_SHA.
          gh api -X POST "repos/${{ github.repository }}/statuses/$sha" \
            -f state=success -f context="Staging Verified" \
            -f description="Verified on $GITHUB_SHA; release/next only adds the v$next version bump" \
            -f target_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          echo "version=$next" >> "$GITHUB_OUTPUT"

      - name: Open or update the release PR
        if: ${{ steps.prep.outputs.skip != 'true' }}
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RELEASE_VERSION: ${{ steps.prep.outputs.version }}
        run: |
          ahead=$(git rev-list --count origin/main..origin/develop)

          short="${GITHUB_SHA:0:7}"
          {
            echo "## Release candidate: develop -> main"
            echo
            echo "Staging is verified for \`$short\`: deployed to testing, API automation and UI automation passed."
            echo
            echo "- Run and reports: $RUN_URL"
            echo "- Pipeline dashboard: $DASHBOARD_URL"
            echo "- Release version: \`v$RELEASE_VERSION\` (bumped on \`release/next\`; production-verify tags the same number)"
            echo "- Commits not yet on main: $ahead"
            echo
            echo "### Changes"
            git log origin/main..origin/develop --format='- %s (%h)' | head -n 50
            echo
            echo "---"
            echo "Merging this PR deploys to production. Use **Create a merge commit** (not squash) to keep develop and main aligned."
          } > "$RUNNER_TEMP/release-body.md"

          title="Release v$RELEASE_VERSION: develop -> main ($short)"
          existing=$(gh pr list --base main --head release/next --state open --json number --jq '.[0].number // empty')
          if [ -z "$existing" ]; then
            gh pr create --base main --head release/next --title "$title" --body-file "$RUNNER_TEMP/release-body.md"
          else
            gh pr edit "$existing" --title "$title" --body-file "$RUNNER_TEMP/release-body.md"
            echo "Updated release PR #$existing"
          fi
