name: Staging Pipeline

# Runs after every merge to develop. Render and Vercel auto-deploy the testing apps on their own;
# this pipeline waits for that deploy to finish, runs API then UI automation against it and,
# when everything passes, marks the commit "Staging Verified" and opens/updates the
# develop -> main release PR for a human to approve.

on:
  push:
    branches: [develop]
  workflow_dispatch:

# A newer merge supersedes an older run - only the latest develop commit matters.
concurrency:
  group: staging-pipeline
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Override with repository variables if the testing URLs ever change.
  API_URL: ${{ vars.STAGING_API_URL || 'https://dairy-distribution-manager-vmd-testing.onrender.com' }}
  WEB_URL: ${{ vars.STAGING_WEB_URL || 'https://dairy-distribution-manager-vmd-testing.vercel.app' }}
  VERCEL_PROJECT: ${{ vars.STAGING_VERCEL_PROJECT || 'dairy-distribution-manager-vmd-testing' }}

jobs:
  wait-for-deploy:
    name: Wait for testing deploy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      deployments: read
      statuses: write
    steps:
      - uses: actions/checkout@v7

      # Blocks the release PR immediately: the previous "Staging Verified" belongs to an older SHA.
      - name: Mark Staging Verified as pending
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X POST "repos/${{ github.repository }}/statuses/${{ github.sha }}" \
            -f state=pending -f context="Staging Verified" \
            -f description="Waiting for deploy and automation" \
            -f target_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      - name: Wait for Render (backend)
        run: .github/scripts/wait-for-backend.sh "$API_URL" "${{ github.sha }}"

      - name: Wait for Vercel (frontend)
        env:
          GH_TOKEN: ${{ github.token }}
          VERCEL_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: .github/scripts/wait-for-vercel.sh "${{ github.repository }}" "${{ github.sha }}" "$VERCEL_PROJECT" "$WEB_URL"

  api-e2e:
    name: API automation (REST Assured + Cucumber)
    needs: wait-for-deploy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: maven
          cache-dependency-path: automation/pom.xml
      - name: Run @api scenarios
        working-directory: automation
        env:
          API_BASE_URL: ${{ env.API_URL }}
          EXPECTED_COMMIT: ${{ github.sha }}
        run: mvn -B -ntp test -Dcucumber.filter.tags="@api"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: api-e2e-report
          path: automation/target/cucumber-reports
          if-no-files-found: ignore

  ui-e2e:
    name: UI automation (Playwright + Cucumber)
    needs: api-e2e
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: staging
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: maven
          cache-dependency-path: automation/pom.xml
      - name: Install Playwright Chromium
        working-directory: automation
        run: >
          mvn -B -ntp test-compile org.codehaus.mojo:exec-maven-plugin:3.5.0:java
          -Dexec.mainClass=com.microsoft.playwright.CLI
          -Dexec.classpathScope=test
          -Dexec.args="install --with-deps chromium"
      - name: Run @ui scenarios
        working-directory: automation
        env:
          WEB_BASE_URL: ${{ env.WEB_URL }}
          VERCEL_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          E2E_ADMIN_USERNAME: ${{ secrets.E2E_ADMIN_USERNAME }}
          E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}
        run: mvn -B -ntp test -Dcucumber.filter.tags="@ui"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-e2e-report
          path: |
            automation/target/cucumber-reports
            automation/target/traces
          if-no-files-found: ignore

  finalize:
    name: Report Staging Verified
    needs: [wait-for-deploy, api-e2e, ui-e2e]
    # Runs on failure too (so the status turns red), but not when this run was superseded.
    if: ${{ always() && !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      statuses: write
    env:
      # Job-level so the Slack step's `if` can see it (a step's own env is not visible to its `if`).
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
    steps:
      - name: Post Staging Verified status
        env:
          GH_TOKEN: ${{ github.token }}
          UI_RESULT: ${{ needs.ui-e2e.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ "$UI_RESULT" = "success" ]; then
            state=success; desc="Deployed, API and UI automation passed"
          else
            state=failure; desc="Deploy or automation failed - see run"
          fi
          gh api -X POST "repos/${{ github.repository }}/statuses/${{ github.sha }}" \
            -f state="$state" -f context="Staging Verified" \
            -f description="$desc" -f target_url="$RUN_URL"
      - name: Notify Slack
        if: ${{ env.SLACK_WEBHOOK_URL != '' }}
        env:
          UI_RESULT: ${{ needs.ui-e2e.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ "$UI_RESULT" = "success" ]; then icon=":white_check_mark:"; word="passed"; else icon=":x:"; word="FAILED"; fi
          jq -n --arg t "$icon Staging pipeline $word for \`${GITHUB_SHA:0:7}\` - <$RUN_URL|view run>" '{text: $t}' \
            | curl -sS -X POST -H 'Content-type: application/json' --data @- "$SLACK_WEBHOOK_URL"

  release-pr:
    name: Open develop -> main release PR
    needs: [ui-e2e, finalize]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    env:
      # Job-level: the `secrets` context is not allowed in a step `if`, `env` is.
      RELEASE_BOT_APP_ID: ${{ secrets.RELEASE_BOT_APP_ID }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # A PR opened with the default GITHUB_TOKEN does not trigger other workflows, so PR Checks
      # would never run on it. A GitHub App token does. Falls back to GITHUB_TOKEN if no app is set up.
      - name: Create GitHub App token
        id: app-token
        if: ${{ env.RELEASE_BOT_APP_ID != '' }}
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.RELEASE_BOT_APP_ID }}
          private-key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}

      - name: Open or update the release PR
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          ahead=$(git rev-list --count origin/main..origin/develop)
          if [ "$ahead" -eq 0 ]; then
            echo "develop has nothing that main lacks - no release PR needed"
            exit 0
          fi

          short="${GITHUB_SHA:0:7}"
          {
            echo "## Release candidate: develop -> main"
            echo
            echo "Staging is verified for \`$short\`: deployed to testing, API automation and UI automation passed."
            echo
            echo "- Run and reports: $RUN_URL"
            echo "- Commits not yet on main: $ahead"
            echo
            echo "### Changes"
            git log origin/main..origin/develop --format='- %s (%h)' | head -n 50
            echo
            echo "---"
            echo "Merging this PR deploys to production. Use **Create a merge commit** (not squash) to keep develop and main aligned."
          } > "$RUNNER_TEMP/release-body.md"

          title="Release: develop -> main ($short)"
          existing=$(gh pr list --base main --head develop --state open --json number --jq '.[0].number // empty')
          if [ -z "$existing" ]; then
            gh pr create --base main --head develop --title "$title" --body-file "$RUNNER_TEMP/release-body.md"
          else
            gh pr edit "$existing" --title "$title" --body-file "$RUNNER_TEMP/release-body.md"
            echo "Updated release PR #$existing"
          fi
