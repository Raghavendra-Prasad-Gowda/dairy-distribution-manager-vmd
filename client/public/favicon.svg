<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Rounded square background in deep emerald -->
  <rect width="32" height="32" rx="7" fill="#065f46"/>

  <!-- Milk bottle body -->
  <rect x="10" y="14" width="12" height="12" rx="2.5" fill="white"/>

  <!-- Milk bottle neck -->
  <rect x="12.5" y="10" width="7" height="5" rx="1.5" fill="white"/>

  <!-- Milk bottle cap -->
  <rect x="13.5" y="7.5" width="5" height="3.5" rx="1.5" fill="#6ee7b7"/>

  <!-- Subtle shine on bottle body -->
  <rect x="12" y="16" width="2.5" height="6" rx="1.25" fill="#065f46" opacity="0.12"/>
</svg>
